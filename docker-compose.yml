version: "3.9"

# ══════════════════════════════════════════════════════════════════════════════
#  SmartCareHub — Docker Compose
#  SE3020 Distributed Systems | Member 1: Patient Service + Auth + Frontend
# ══════════════════════════════════════════════════════════════════════════════

networks:
  smartcare-net:
    driver: bridge

volumes:
  auth-db-data:
    driver: local
  patient-db-data:
    driver: local
  patient-uploads:
    driver: local

services:

  # ── Auth MongoDB ─────────────────────────────────────────────────────────
  auth-db:
    image: mongo:7.0
    container_name: auth-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - smartcare-net
    volumes:
      - auth-db-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: auth-service
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Patient MongoDB ──────────────────────────────────────────────────────
  patient-db:
    image: mongo:7.0
    container_name: patient-db
    restart: unless-stopped
    ports:
      - "27018:27017"
    networks:
      - smartcare-net
    volumes:
      - patient-db-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: patient-service
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Auth Service ─────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    networks:
      - smartcare-net
    environment:
      PORT: 5001
      MONGO_URI: mongodb://auth-db:27017/auth-service
      JWT_SECRET: ${JWT_SECRET:-SmartCareHub_JWT_Secret_2026}
      NODE_ENV: production
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # ── Patient Service ──────────────────────────────────────────────────────
  patient-service:
    build:
      context: ./backend/patient-service
      dockerfile: Dockerfile
    container_name: patient-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    networks:
      - smartcare-net
    volumes:
      - patient-uploads:/app/src/uploads
    environment:
      PORT: 5002
      MONGO_URI: mongodb://patient-db:27017/patient-service
      JWT_SECRET: ${JWT_SECRET:-SmartCareHub_JWT_Secret_2026}
      NODE_ENV: production
    depends_on:
      patient-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/api/patients/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # ── Frontend (React + Nginx) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    networks:
      - smartcare-net
    ports:
      - "80:80"
    depends_on:
      auth-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
