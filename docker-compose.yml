# ══════════════════════════════════════════════════════════════════════════════
#  SmartCareHub — Docker Compose (MongoDB Atlas Integrated)
# ══════════════════════════════════════════════════════════════════════════════

networks:
  smartcare-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: smartcare-net

# Global DNS for all services (resolves MongoDB Atlas SRV records)
x-dns: &default-dns
  dns:
    - 8.8.8.8
    - 8.8.4.4

services:

  # ── Auth Service ─────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - smartcare-net
    env_file:
      - ./backend/auth-service/.env
    environment:
      PORT: 5001
      NODE_ENV: production
      # MONGO_URI is pulled from env_file
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # ── Patient Service ──────────────────────────────────────────────────────
  patient-service:
    build:
      context: ./backend/patient-service
      dockerfile: Dockerfile
    container_name: patient-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - smartcare-net
    volumes:
      - patient-uploads:/app/src/uploads
    env_file:
      - ./backend/patient-service/.env
    environment:
      PORT: 5002
      NODE_ENV: production
      DOCTOR_SERVICE_URL: http://doctor-service:5002
      # MONGO_URI is pulled from env_file
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/api/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # ── Appointment Service ──────────────────────────────────────────────────
  appointment-service:
    build:
      context: ./backend/appointment-service
      dockerfile: Dockerfile
    container_name: appointment-service
    restart: unless-stopped
    ports:
      - "5003:5001" # Host:5003 -> Container:5001
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - smartcare-net
    env_file:
      - ./backend/appointment-service/.env
    environment:
      PORT: 5001
      DOCTOR_SERVICE_URL: http://doctor-service:5002
      NOTIFICATION_SERVICE_URL: http://notification-service:5005/api/notifications
      # MONGODB_URI is pulled from env_file
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # ── Doctor Service ───────────────────────────────────────────────────────
  doctor-service:
    build:
      context: ./backend/doctor-service
      dockerfile: Dockerfile
    container_name: doctor-service
    restart: unless-stopped
    ports:
      - "5010:5002" # Host:5010 -> Container:5002
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - smartcare-net
    env_file:
      - ./backend/doctor-service/.env
    environment:
      PORT: 5002
      NOTIFICATION_SERVICE_URL: http://notification-service:5005/api/notifications
      # MONGO_URI is pulled from env_file
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # ── Payment Service ──────────────────────────────────────────────────────
  payment-service:
    build:
      context: ./backend/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "5011:5002" # Host:5011 -> Container:5002
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - smartcare-net
    env_file:
      - ./backend/payment-service/.env
    environment:
      PORT: 5002
      # MONGODB_URI is pulled from env_file
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # ── Telemedicine Service ─────────────────────────────────────────────────
  telemedicine-service:
    build:
      context: ./backend/telemedicine-service
      dockerfile: Dockerfile
    container_name: telemedicine-service
    restart: unless-stopped
    ports:
      - "5004:5004"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - smartcare-net
    env_file:
      - ./backend/telemedicine-service/.env
    environment:
      PORT: 5004
      # MONGO_URI is pulled from env_file

  # ── Notification Service ──────────────────────────────────────────────────
  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "5005:5005"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - smartcare-net
    env_file:
      - ./backend/notification-service/.env
    environment:
      PORT: 5005
      # MONGO_URI is pulled from env_file

  # ── AI Symptom Service ────────────────────────────────────────────────────
  ai-symptom-service:
    build:
      context: ./backend/ai-symptom-service
      dockerfile: Dockerfile
    container_name: ai-symptom-service
    restart: unless-stopped
    ports:
      - "5006:5006"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - smartcare-net
    env_file:
      - ./backend/ai-symptom-service/.env
    environment:
      PORT: 5006
      # MONGO_URI is pulled from env_file

  # ── API Gateway ──────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - smartcare-net
    environment:
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-SmartCareHub_JWT_Secret_2026}
      APPOINTMENT_SERVICE_URL: http://appointment-service:5001
      PAYMENT_SERVICE_URL: http://payment-service:5002
      PATIENT_SERVICE_URL: http://patient-service:5002
      AUTH_SERVICE_URL: http://auth-service:5001
      DOCTOR_SERVICE_URL: http://doctor-service:5002
      NOTIFICATION_SERVICE_URL: http://notification-service:5005
      TELEMEDICINE_SERVICE_URL: http://telemedicine-service:5004
      AI_SYMPTOM_SERVICE_URL: http://ai-symptom-service:5006
    depends_on:
      appointment-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_started
      telemedicine-service:
        condition: service_started

  # ── Frontend (React + Nginx) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    networks:
      - smartcare-net
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_started
      auth-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      doctor-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  patient-uploads:
    driver: local
