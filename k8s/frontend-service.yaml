# ══════════════════════════════════════════════════════════════════════════════
#  Frontend — NodePort Service
#  Access via:  http://<minikube-ip>:30080
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: smartcarehub
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
