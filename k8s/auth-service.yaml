# ══════════════════════════════════════════════════════════════════════════════
#  Auth Service — ClusterIP Service
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: smartcarehub
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 5001
      targetPort: 5001
